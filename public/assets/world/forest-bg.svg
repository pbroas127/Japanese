<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 854" width="480" height="854" preserveAspectRatio="xMidYMid slice">
  <!-- Forest world-map background · fallback · full (non-transparent) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bdebd0"/>
      <stop offset="0.5" stop-color="#8fdcb0"/>
      <stop offset="1" stop-color="#5cae7c"/>
    </linearGradient>
  </defs>
  <rect width="480" height="854" fill="url(#sky)"/>

  <!-- distant tree line -->
  <g fill="#4f9e6f" opacity="0.7">
    <circle cx="60" cy="120" r="60"/><circle cx="150" cy="100" r="70"/>
    <circle cx="250" cy="120" r="60"/><circle cx="350" cy="95" r="75"/>
    <circle cx="440" cy="120" r="60"/>
  </g>
  <rect y="120" width="480" height="734" fill="#67b884"/>

  <!-- rolling hills -->
  <path d="M0 300 Q120 250 240 300 T480 300 V854 H0 Z" fill="#56a874"/>
  <path d="M0 470 Q140 420 280 470 T480 460 V854 H0 Z" fill="#469262"/>
  <path d="M0 640 Q160 600 320 650 T480 640 V854 H0 Z" fill="#3a8055"/>

  <!-- winding path -->
  <path d="M110 820 Q260 720 150 600 Q60 500 260 430 Q420 380 200 250 Q120 200 320 120"
        fill="none" stroke="#e8d3a3" stroke-width="34" stroke-linecap="round"/>
  <path d="M110 820 Q260 720 150 600 Q60 500 260 430 Q420 380 200 250 Q120 200 320 120"
        fill="none" stroke="#f3e6c4" stroke-width="20" stroke-linecap="round" stroke-dasharray="2 26"/>

  <!-- foreground trees -->
  <g>
    <ellipse cx="56" cy="540" rx="46" ry="54" fill="#2f7d52"/>
    <rect x="48" y="560" width="16" height="40" rx="6" fill="#7a5535"/>
    <ellipse cx="430" cy="640" rx="54" ry="62" fill="#2b714b"/>
    <rect x="422" y="664" width="18" height="46" rx="6" fill="#7a5535"/>
    <ellipse cx="400" cy="300" rx="40" ry="48" fill="#357f57"/>
    <rect x="393" y="320" width="14" height="36" rx="6" fill="#7a5535"/>
  </g>

  <!-- mushrooms & flowers -->
  <g>
    <circle cx="180" cy="760" r="10" fill="#e8556b"/><rect x="176" y="760" width="8" height="14" rx="4" fill="#fff0e0"/>
    <circle cx="300" cy="700" r="6" fill="#ffd54a"/>
    <circle cx="120" cy="690" r="6" fill="#ffd54a"/>
    <circle cx="350" cy="500" r="6" fill="#ff9ec2"/>
  </g>

  <!-- fireflies -->
  <g fill="#fff7c4">
    <circle cx="90" cy="240" r="3"/><circle cx="380" cy="180" r="2.5"/>
    <circle cx="250" cy="350" r="2.5"/><circle cx="160" cy="450" r="3"/>
    <circle cx="410" cy="430" r="2.5"/>
  </g>
</svg>
